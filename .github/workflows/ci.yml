name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Script tests
        run: python3 -m unittest discover -s scripts -v

      - name: Manifest is valid and every binary resolves
        # Downloads each binaryTarget and verifies its checksum, exactly as a partner's SwiftPM would
        run: |
          swift package dump-package > /dev/null
          swift package resolve
          swift package describe > /dev/null

      - name: Binaries built from source fit together
        # Kit and UI from the same build, and the PulpoModule they were built against (scripts/build_info.py)
        run: python3 scripts/build_info.py check
